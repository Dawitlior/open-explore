[build]
  command = "vite build"
  publish = "dist"

# SPA fallback: all routes serve index.html so React Router works on deep links / refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers (audit F-02 hardening, 2026-08). CSP mirrors the <meta> policy in
# index.html; delivered as a header here so frame-ancestors (clickjacking guard)
# actually applies — browsers ignore frame-ancestors in <meta> elements.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://s3.tradingview.com https://*.lovable.dev https://*.lovableproject.com https://cdn.gpteng.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://*.tradingview.com; worker-src 'self'; manifest-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

[build.environment]
  NODE_VERSION = "20"
